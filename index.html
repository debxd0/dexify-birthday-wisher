<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dexifyyywisher</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@300;400;500&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style id="css">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#FCF8F3;--bg2:#F5E6D6;--ink:#30231D;--mute:#846D62;--rose:#6E4635;--pf:#FCF8F3;--card:#FFFFFF;--line:#E4D9CD;--ov:rgba(252,248,243,.55)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181310;--bg2:#2C2421;--ink:#F3ECE2;--mute:#AD9985;--rose:#C08259;--pf:#181310;--card:#211A17;--line:#3B302B;--ov:rgba(24,19,16,.6)}}
:root[data-theme="dark"]{--bg:#181310;--bg2:#2C2421;--ink:#F3ECE2;--mute:#AD9985;--rose:#C08259;--pf:#181310;--card:#211A17;--line:#3B302B;--ov:rgba(24,19,16,.6)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
html.cc,html.cc *{cursor:none!important}
body{margin:0;background:radial-gradient(120% 80% at 50% 0,var(--bg2),var(--bg) 70%);background-color:var(--bg);color:var(--ink);font:300 16px/1.7 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;font-weight:700;letter-spacing:-.02em;margin:0}
section{padding:72px 20px;max-width:960px;margin:auto;text-align:center}
h2{font-size:clamp(24px,5vw,36px);color:var(--rose)}
.sub{color:var(--mute);margin:6px 0 34px}
.hero{max-width:none;min-height:100svh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(var(--ov),var(--bg)),var(--h,none) center/cover}
.in{position:relative;z-index:2}
.brand{letter-spacing:.35em;text-transform:uppercase;font-size:12px;color:var(--rose);margin-bottom:22px}
.pic{width:170px;height:170px;border-radius:50%;object-fit:cover;border:3px solid var(--rose);box-shadow:0 10px 40px color-mix(in srgb,var(--rose) 40%,transparent);margin:0 auto 20px;display:block}
.ph{display:flex;align-items:center;justify-content:center;font-size:64px;background:var(--card)}
.kick{color:var(--mute);letter-spacing:.2em;text-transform:uppercase;font-size:13px;margin:0 0 8px}
h1{font-size:clamp(38px,10vw,80px);line-height:1.08}
h1 em{color:var(--rose);font-style:normal}
.tag{max-width:480px;margin:16px auto;color:var(--mute)}
.dn{color:var(--rose);font-size:28px;text-decoration:none;display:inline-block;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.pt span{position:absolute;top:-30px;animation:fall linear infinite;opacity:.7;z-index:1}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.pt,.dn{display:none}}
.pw{position:relative;max-width:560px;margin:0 auto}
.paper{max-height:min(68vh,520px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#B9C6DD transparent;padding:28px 24px 28px 56px;background-color:#FBF7EC;color:#23325C;font:400 25px/36px Caveat,'Segoe Script','Bradley Hand',cursive;text-align:left;border-radius:3px;box-shadow:0 1px 1px rgba(0,0,0,.25),0 14px 34px rgba(0,0,0,.28);background-image:linear-gradient(90deg,transparent 40px,#E3A0A0 40px,#E3A0A0 42px,transparent 42px),repeating-linear-gradient(transparent 0,transparent 35px,#C8D3E6 35px,#C8D3E6 36px);background-attachment:local,local;background-position:0 0,0 28px}
.paper p{margin:0 0 36px;white-space:pre-wrap}
.paper .sig{text-align:right;margin:0;font-weight:600}
.sh{color:var(--mute);font-size:13px;margin:14px 0 0;transition:opacity .4s}
.tp{position:absolute;top:-12px;z-index:2;width:90px;height:26px;background:rgba(240,226,180,.85);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tp.a{left:22px;transform:rotate(-6deg)}.tp.b{right:22px;transform:rotate(5deg)}
.meta{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--rose);margin:22px 0 12px}
button{font:inherit;cursor:pointer;border:1px solid var(--rose);background:var(--rose);color:var(--pf);padding:8px 18px;border-radius:99px}
button.g{background:none;color:var(--ink)}
.rs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:28px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;transition:transform .25s}
.rc:hover{transform:translateY(-4px)}
.rc b{display:block;color:var(--rose);font-family:Sora,sans-serif;font-size:24px}
.gm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin-top:10px}
.bc{position:relative;min-height:170px;display:flex;align-items:center;justify-content:center}
.bl{width:72px;height:90px;padding:0;border:0;border-radius:50% 50% 47% 47%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),transparent 36%),var(--c);position:relative;box-shadow:inset -6px -8px 14px rgba(0,0,0,.18)}
.bl:before{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-5px;border:5px solid transparent;border-top:0;border-bottom:8px solid var(--c)}
.bl:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:36px;background:var(--mute)}
@media(prefers-reduced-motion:no-preference){.bl{animation:fl 3s ease-in-out infinite}.bc:nth-child(2n) .bl{animation-delay:-1s}.bc:nth-child(3n) .bl{animation-delay:-2s}}
@keyframes fl{50%{transform:translateY(-10px) rotate(2deg)}}
.pf{position:absolute;width:9px;height:9px;border-radius:50%;animation:bs .6s ease-out forwards}
@keyframes bs{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.nt{background:#FBF7EC;color:#23325C;font:400 22px/1.25 Caveat,'Segoe Script',cursive;padding:14px 16px;border-radius:3px;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:rotate(-2deg);animation:pi .4s ease}
@keyframes pi{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:28px}
.gl img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;border:1px solid var(--line);transition:transform .3s}
.gl img:hover{transform:scale(1.04) rotate(-1deg)}
.from{color:var(--mute);font-style:italic}
.mk{padding:40px 20px 56px}
a.bn{display:inline-block;margin-top:10px;padding:10px 24px;border:1px solid var(--rose);border-radius:99px;color:var(--ink);text-decoration:none;transition:background .2s}
a.bn:hover{background:color-mix(in srgb,var(--rose) 15%,transparent)}
.hn{color:var(--mute);font-size:13px;margin:12px 0 0}
footer{text-align:center;padding:36px 20px 44px;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.tg{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:55;width:42px;height:42px;padding:0;font-size:18px;background:var(--card);color:var(--ink);border-color:var(--line)}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:60;background:var(--card);border-left:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;text-align:left}
.dr label{display:block;font-size:13px;color:var(--mute);margin-top:12px}
.dr input:not([type=file]),.dr textarea,.dr select{width:100%;margin-top:4px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.dr input[type=file]{display:block;margin-top:4px;color:var(--ink);max-width:100%}
.hint{color:var(--mute);font-size:13px;margin:4px 0}
.tabs{display:flex;gap:8px;margin:12px 0 4px}
.ths{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ths div{position:relative}
.ths img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.ths button{position:absolute;top:-6px;right:-6px;padding:0;width:20px;height:20px;line-height:1;font-size:13px}
.bt{display:flex;gap:10px;margin-top:18px}
.msg{min-height:22px;margin-top:10px;color:var(--rose);font-size:13px}
.lk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.lk input{flex:1;min-width:0}
.lk a{color:var(--rose)}
.custom-cursor{width:20px;height:20px;background:var(--rose);border-radius:50%;position:fixed;left:-50px;top:-50px;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .2s,height .2s,background-color .2s}
.custom-cursor.hover{width:50px;height:50px;background:color-mix(in srgb,var(--rose) 30%,transparent);backdrop-filter:blur(4px);border:1px solid color-mix(in srgb,var(--rose) 50%,transparent)}
</style></head>
<body><div id="app"></div>
<script id="state" type="application/json">{"repo":"https://github.com/debxd0/dexify-birthday-wisher"}</script>
<script id="code">
(function(){
const $=s=>document.querySelector(s),CL=window.claude;
const FONT='https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@300;400;500&family=Caveat:wght@400;600&display=swap';
const BC=['#C0504D','#D98E3F','#8E6B4E','#C77D8E','#6F8F72','#B5651D','#A05A6C','#7A5C8E'];
const D={name:'Your Special Person',from:'Someone who adores you',tagline:'Sending you oceans of love and constellations of wishes.',
letter:'Today I didn’t want to send just a normal wish. I wanted to write something that captures who you are and the way you make people feel.\n\nThere is something about you that feels calm, real and rare. Thank you for being exactly who you are.\n\nI hope this year brings you everything you’ve been quietly wishing for. Happy Birthday!',
reasons:['You always make me smile','Your kindness is rare','You make ordinary days feel special','The world is better with you in it'],hero:'',gallery:[],
game:{n:5,msgs:['You light up every room you walk into.','Thank you for being you.','Your smile is my favourite thing.','I’m so lucky to know you.','Here’s to your best year yet!','You deserve all the happiness.','Stay amazing, always.','Happy Birthday, my favourite person!']}};
let st=Object.assign({},D,JSON.parse($('#state').textContent||'{}'));
const fixG=s=>{while(s.game.msgs.length<8)s.game.msgs.push('')};fixG(st);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function game(){
 const g=$('#gm'),n=st.game.n,cnt=$('#gc');let k=0;g.innerHTML='';cnt.textContent='0/'+n+' popped';
 for(let i=0;i<n;i++){
  const c=document.createElement('div'),b=document.createElement('button');
  c.className='bc';b.className='bl';b.style.setProperty('--c',BC[i]);b.setAttribute('aria-label','Pop balloon '+(i+1));
  b.onclick=()=>{
   for(let j=0;j<10;j++){const s=document.createElement('i');s.className='pf';s.style.cssText='left:calc(50% - 4px);top:calc(50% - 4px);background:'+BC[i]+';--x:'+Math.round(Math.cos(j*.63)*64)+'px;--y:'+Math.round(Math.sin(j*.63)*64)+'px';c.appendChild(s);setTimeout(()=>s.remove(),650)}
   b.remove();const m=document.createElement('div');m.className='nt';m.textContent=st.game.msgs[i]||'You’re loved 💛';c.appendChild(m);
   k++;cnt.textContent=k+'/'+n+' popped'+(k==n?' 🎉':'');
  };
  c.appendChild(b);g.appendChild(c);
 }
}
function render(){
 document.title='dexifyyywisher · Happy Birthday '+st.name;
 $('#app').innerHTML=
 '<section class="hero" id="hero"><div class="pt" id="pt"></div><div class="in"><div class="brand">dexifyyywisher</div>'+(st.hero?'<img class="pic" id="pic" alt="">':'<div class="pic ph">🎂</div>')+
 '<p class="kick">Hope your year is amazing</p><h1>Happy Birthday<br><em>'+esc(st.name)+'</em></h1><p class="tag">'+esc(st.tagline)+'</p><a class="dn" href="#letter">↓</a></div></section>'+
 '<section id="letter"><h2>My Heart to Yours</h2><p class="sub">Every word, a little piece of me</p><div class="pw"><i class="tp a"></i><i class="tp b"></i><div class="paper" id="pp"></div></div><p class="sh" id="sh">↓ scroll to read</p></section>'+
 '<section><h2>Why You’re Amazing</h2><div class="rs">'+st.reasons.map((r,i)=>'<div class="rc"><b>'+String(i+1).padStart(2,'0')+'</b>'+esc(r)+'</div>').join('')+'</div></section>'+
 '<section><h2>Pop the Balloons</h2><p class="sub">Every balloon hides something I wanted you to know</p><div class="gm" id="gm"></div><p class="meta" id="gc"></p><button class="g" id="gr">Play again</button></section>'+
 (st.gallery.length?'<section><h2>Memories We Cherish</h2><div class="gl" id="gl"></div></section>':'')+
 '<section><h2>Here’s to another year of making memories.</h2><p class="from">— '+esc(st.from)+'</p></section>'+(/^https?:\/\//.test(st.repo||'')?'<section class="mk"><p class="from">Want one for someone you love?</p><a class="bn" href="'+esc(st.repo)+'" target="_blank" rel="noopener">Get your own copy on GitHub ↗</a><p class="hn">Open the repo, download or fork it, then edit it and make it yours.</p></section>':'')+'<footer>Made with love ♥</footer>';
 if(st.hero){$('#pic').src=st.hero;$('#hero').style.setProperty('--h','url('+JSON.stringify(st.hero)+')')}
 const pp=$('#pp'),add=(t,c)=>{const p=document.createElement('p');p.textContent=t;if(c)p.className=c;pp.appendChild(p)};
 add('Dear '+st.name+',');
 st.letter.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).forEach(x=>add(x));
 add('With all my love,\n'+st.from,'sig');
 pp.onscroll=()=>{$('#sh').style.opacity=0};
 requestAnimationFrame(()=>{if(pp.scrollHeight<=pp.clientHeight+4)$('#sh').remove()});
 const g=$('#gl');if(g)st.gallery.forEach(u=>{const i=new Image();i.src=u;i.alt='Memory';g.appendChild(i)});
 const pt=$('#pt'),E=['🌹','♥','✦'];
 for(let i=0;i<16;i++){const s=document.createElement('span');s.textContent=E[i%3];s.style.cssText='left:'+Math.random()*100+'%;font-size:'+(12+Math.random()*16)+'px;animation-duration:'+(8+Math.random()*10)+'s;animation-delay:-'+Math.random()*12+'s';pt.appendChild(s)}
 $('#gr').onclick=game;game();
}
function build(s){
 const css=$('#css').textContent,code=$('#code').textContent,T='<'+'/script>',S='<scr'+'ipt';
 const j=JSON.stringify(s).replace(/</g,'\\u003c');
 return '<!doc'+'type html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>dexifyyywisher</title><link href="'+FONT+'" rel="stylesheet"><style id="css">'+css+'</style></head><body><div id="app"></div>'+S+' id="state" type="application/json">'+j+T+S+' id="code">'+code+T+'</body></html>';
}
function shrink(f,max,q){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function openEdit(){
 if($('.dr'))return;
 const d=JSON.parse(JSON.stringify(st)),p=document.createElement('div'),q=s=>p.querySelector(s);
 p.className='dr';
 p.innerHTML='<h3>Edit your page</h3><p class="hint">Only you can see this panel. Visitors never get it.</p><div class="tabs"><button id="b1">Page</button><button id="b2" class="g">Game</button><button id="b3" class="g">Share</button></div>'+
 '<div id="t1"><label>Birthday person’s name<input id="e1"></label><label>From (your name)<input id="e2"></label><label>Subtitle<input id="e3"></label><label>Birthday person’s photo (shows on top instead of 🎂)<input type="file" id="e6" accept="image/*"></label><div class="ths" id="hp"></div><label>Letter (blank line = new paragraph)<textarea id="e4" rows="8"></textarea></label><label>Reasons (one per line)<textarea id="e5" rows="5"></textarea></label><label>Gallery photos<input type="file" id="e7" accept="image/*" multiple></label><div class="ths" id="ths"></div></div>'+
 '<div id="t2" hidden><label>Number of balloons (1–8)<select id="gn"></select></label><div id="gms"></div></div>'+
 '<div id="t3" hidden><label>GitHub repo link (also powers the Get your own copy button)<input id="e8" placeholder="https://github.com/you/your-repo"></label><div id="tkw"><label>GitHub token (saved only on this device)<input id="tk" type="password" autocomplete="off" placeholder="github_pat_..."></label><p class="hint">One-time setup: GitHub, Settings, Developer settings, Fine-grained tokens, Generate new token. Choose only this repository, set Contents to Read and write, and add an expiry date. Paste the token here.</p><button class="g" id="tx">Remove saved token</button></div></div>'+
 '<div class="msg" id="ms"></div><div class="lk" id="lk"></div><div class="bt"><button id="sv">Save</button><button id="dl" class="g">Download file</button><button id="cx" class="g">Close</button></div>';
 document.body.appendChild(p);
 q('#e1').value=d.name;q('#e2').value=d.from;q('#e3').value=d.tagline;q('#e4').value=d.letter;q('#e5').value=d.reasons.join('\n');q('#e8').value=d.repo||'';
 const msg=t=>q('#ms').textContent=t;
 const tab=k=>{q('#t1').hidden=k!=1;q('#t2').hidden=k!=2;q('#t3').hidden=k!=3;q('#b1').className=k==1?'':'g';q('#b2').className=k==2?'':'g';q('#b3').className=k==3?'':'g'};
 q('#b1').onclick=()=>tab(1);q('#b2').onclick=()=>tab(2);q('#b3').onclick=()=>tab(3);
 const th=()=>{const t=q('#ths');t.innerHTML='';d.gallery.forEach((u,i)=>{const w=document.createElement('div'),m=new Image(),x=document.createElement('button');m.src=u;x.textContent='×';x.onclick=()=>{d.gallery.splice(i,1);th()};w.append(m,x);t.append(w)})};th();
 const hv=()=>{const t=q('#hp');t.innerHTML='';if(d.hero){const w=document.createElement('div'),m=new Image(),x=document.createElement('button');m.src=d.hero;x.textContent='×';x.title='Remove photo';x.onclick=()=>{d.hero='';hv()};w.append(m,x);t.append(w)}};hv();
 const gm=()=>{const t=q('#gms');t.innerHTML='';for(let i=0;i<d.game.n;i++){const l=document.createElement('label'),inp=document.createElement('input');l.textContent='Balloon '+(i+1)+' message';inp.value=d.game.msgs[i]||'';inp.oninput=()=>{d.game.msgs[i]=inp.value};l.appendChild(inp);t.appendChild(l)}};
 const gn=q('#gn');for(let i=1;i<=8;i++)gn.add(new Option(i,i));gn.value=d.game.n;gn.onchange=()=>{d.game.n=+gn.value;gm()};gm();
 q('#e6').onchange=async e=>{const f=e.target.files[0];if(f){d.hero=await shrink(f,1400,.82);hv()}};
 q('#e7').onchange=async e=>{for(const f of e.target.files){if(d.gallery.length>=12){msg('Max 12 gallery photos.');break}d.gallery.push(await shrink(f,1000,.8))}th()};
 q('#cx').onclick=()=>p.remove();
 const web=!(CL&&CL.use);q('#sv').textContent=web?'Save & get link':'Save & publish';
 if(!web){q('#dl').remove();q('#tkw').remove()}else{q('#dl').onclick=()=>{p.dataset.dl='1';q('#sv').click()};q('#tx').onclick=()=>{try{localStorage.removeItem('dw-gh')}catch(e){}q('#tk').value='';msg('Saved token removed.')}}
 const share=async(d,html)=>{
  if(p.dataset.dl){delete p.dataset.dl;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';a.click();st=d;render();msg('Downloaded index.html.');return}
  const pt=(d.repo||'').split('github.com/')[1],sp=pt?pt.split('/'):[],o=sp[0],r=(sp[1]||'').split(/[?#]/)[0].replace('.git','');
  if(!o||!r){tab(3);throw new Error('Add your GitHub repo link in the Share tab first.')}
  let tok=q('#tk').value.trim();if(!tok){try{tok=localStorage.getItem('dw-gh')||''}catch(e){}}
  if(!tok){tab(3);throw new Error('Paste your GitHub token in the Share tab first.')}
  const api='https://api.github.com/repos/'+o+'/'+r+'/contents/'+d.slug+'/index.html',H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'};
  msg('Saving to GitHub…');
  const g=await fetch(api,{headers:H});let sha;
  if(g.status==401)throw new Error('GitHub rejected the token. Make a new one.');
  if(g.ok)sha=(await g.json()).sha;else if(g.status!=404)throw new Error('GitHub error '+g.status+'. Check the repo link and token access.');
  const by=new TextEncoder().encode(html);let s='';for(let i=0;i<by.length;i+=32768)s+=String.fromCharCode.apply(null,by.subarray(i,i+32768));
  const u=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({message:'Update '+d.slug,content:btoa(s),sha:sha})});
  if(!u.ok)throw new Error(u.status==403||u.status==404?'No permission. The token needs Contents: Read and write on this repo.':'GitHub error '+u.status);
  try{localStorage.setItem('dw-gh',tok)}catch(e){}
  st=d;render();
  const L='https://'+o.toLowerCase()+'.github.io/'+(r.toLowerCase()==o.toLowerCase()+'.github.io'?'':r+'/')+d.slug+'/',l=q('#lk');
  l.innerHTML='';const i=document.createElement('input'),b=document.createElement('button'),a=document.createElement('a');i.readOnly=true;i.value=L;b.textContent='Copy link';b.onclick=()=>{i.select();if(navigator.clipboard)navigator.clipboard.writeText(L)};a.href=L;a.target='_blank';a.textContent='Open ↗';l.append(i,b,a);
  msg('Saved ✓ The link goes live in 1–2 minutes.');
 };
 q('#sv').onclick=async()=>{
  d.name=q('#e1').value.trim()||D.name;d.from=q('#e2').value.trim()||D.from;d.tagline=q('#e3').value.trim();d.letter=q('#e4').value.trim()||D.letter;

 };
